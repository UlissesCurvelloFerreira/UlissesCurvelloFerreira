<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f2c"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a6ea5"/>
      <stop offset="100%" stop-color="#274b73"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5891c9"/>
      <stop offset="100%" stop-color="#3a6ea5"/>
    </linearGradient>
    <linearGradient id="wave3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fc1e8"/>
      <stop offset="100%" stop-color="#5891c9"/>
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#bfe0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#bfe0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="starGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" fill="url(#sky)"/>

  <!-- Estrelas piscando -->
  <circle cx="120" cy="30" r="1.6" fill="#ffffff">
    <animate attributeName="opacity" dur="3.2s" repeatCount="indefinite" values="0.2;1;0.2"/>
  </circle>
  <circle cx="230" cy="20" r="1.2" fill="#ffffff">
    <animate attributeName="opacity" dur="2.4s" repeatCount="indefinite" values="0.9;0.2;0.9"/>
  </circle>
  <circle cx="700" cy="25" r="1.4" fill="#ffffff">
    <animate attributeName="opacity" dur="4s" repeatCount="indefinite" values="0.3;1;0.3"/>
  </circle>
  <circle cx="780" cy="45" r="1" fill="#ffffff">
    <animate attributeName="opacity" dur="2.8s" repeatCount="indefinite" values="1;0.3;1"/>
  </circle>
  <circle cx="600" cy="15" r="1.1" fill="#ffffff">
    <animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0.2;0.9;0.2"/>
  </circle>

  <!-- Estrelas cadentes cruzando toda a extensão do SVG, da direita para a esquerda -->
  <g filter="url(#starGlow)">
    <g transform="rotate(-4.6)">
      <path fill="url(#trailGrad)" d="M0,-2 Q18,-4.5 70,0 Q18,4.5 0,2 Z">
        <animateTransform attributeName="transform" type="scale" dur="1s" repeatCount="indefinite"
          values="1,1;1.12,1;1,1" additive="sum"/>
      </path>
    </g>
    <circle cx="0" cy="0" r="2.4" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
      values="1030,5; -100,95"/>
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite"
      keyTimes="0;0.05;0.95;1" values="0;1;1;0"/>
  </g>
  <g filter="url(#starGlow)">
    <g transform="rotate(-2.9)">
      <path fill="url(#trailGrad)" d="M0,-1.6 Q14,-3.5 55,0 Q14,3.5 0,1.6 Z">
        <animateTransform attributeName="transform" type="scale" dur="1.1s" repeatCount="indefinite"
          values="1,1;1.12,1;1,1" additive="sum"/>
      </path>
    </g>
    <circle cx="0" cy="0" r="1.9" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" dur="13s" begin="3.5s" repeatCount="indefinite"
      values="1030,40; -100,97"/>
    <animate attributeName="opacity" dur="13s" begin="3.5s" repeatCount="indefinite"
      keyTimes="0;0.05;0.95;1" values="0;1;1;0"/>
  </g>
  <g filter="url(#starGlow)">
    <g transform="rotate(-1.7)">
      <path fill="url(#trailGrad)" d="M0,-1.3 Q12,-3 46,0 Q12,3 0,1.3 Z">
        <animateTransform attributeName="transform" type="scale" dur="0.9s" repeatCount="indefinite"
          values="1,1;1.12,1;1,1" additive="sum"/>
      </path>
    </g>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" dur="16s" begin="7s" repeatCount="indefinite"
      values="1030,70; -100,104"/>
    <animate attributeName="opacity" dur="16s" begin="7s" repeatCount="indefinite"
      keyTimes="0;0.05;0.95;1" values="0;1;1;0"/>
  </g>
  <g filter="url(#starGlow)">
    <g transform="rotate(-5.7)">
      <path fill="url(#trailGrad)" d="M0,-1.9 Q16,-4 60,0 Q16,4 0,1.9 Z">
        <animateTransform attributeName="transform" type="scale" dur="1s" repeatCount="indefinite"
          values="1,1;1.12,1;1,1" additive="sum"/>
      </path>
    </g>
    <circle cx="0" cy="0" r="2.1" fill="#ffffff"/>
    <animateTransform attributeName="transform" type="translate" dur="8s" begin="1.5s" repeatCount="indefinite"
      values="1030,15; -100,128"/>
    <animate attributeName="opacity" dur="8s" begin="1.5s" repeatCount="indefinite"
      keyTimes="0;0.05;0.95;1" values="0;1;1;0"/>
  </g>

  <!-- Camada de onda de fundo (variação de forma suave, ciclo mais longo e calmo) -->
  <path fill="url(#wave1)" opacity="0.55">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="
        M0,160 C150,130 350,185 500,150 C650,115 850,190 1000,160 L1000,220 L0,220 Z;
        M0,140 C200,180 300,120 500,165 C700,205 800,130 1000,140 L1000,220 L0,220 Z;
        M0,170 C100,135 410,200 500,145 C600,95 930,200 1000,170 L1000,220 L0,220 Z;
        M0,150 C270,195 350,120 500,175 C770,220 850,130 1000,150 L1000,220 L0,220 Z;
        M0,165 C130,115 400,205 500,130 C610,80 900,205 1000,165 L1000,220 L0,220 Z;
        M0,160 C150,130 350,185 500,150 C650,115 850,190 1000,160 L1000,220 L0,220 Z"/>
  </path>

  <!-- Camada de onda média (variação de forma suave, ciclo calmo) -->
  <path fill="url(#wave2)" opacity="0.7">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,185 C200,160 300,210 500,180 C700,160 800,210 1000,185 L1000,220 L0,220 Z;
        M0,170 C260,215 350,150 500,197 C650,225 900,150 1000,170 L1000,220 L0,220 Z;
        M0,200 C100,165 420,225 500,160 C590,125 950,225 1000,200 L1000,220 L0,220 Z;
        M0,178 C310,220 350,155 500,208 C820,235 850,150 1000,178 L1000,220 L0,220 Z;
        M0,193 C150,150 300,228 500,163 C630,110 870,228 1000,193 L1000,220 L0,220 Z;
        M0,185 C200,160 300,210 500,180 C700,160 800,210 1000,185 L1000,220 L0,220 Z"/>
  </path>

  <!-- Camada de onda frontal (sincronizada ao barco, ritmo mais calmo) -->
  <path fill="url(#wave3)" opacity="0.9">
    <animate attributeName="d" dur="4s" repeatCount="indefinite"
      values="
        M0,197 C250,187 350,213 500,197 C650,187 750,213 1000,197 L1000,220 L0,220 Z;
        M0,208 C250,218 350,192 500,208 C650,218 750,192 1000,208 L1000,220 L0,220 Z;
        M0,197 C250,187 350,213 500,197 C650,187 750,213 1000,197 L1000,220 L0,220 Z"/>
  </path>

  <!-- Brilho da lua no mar (leve reflexo cintilante) -->
  <ellipse cx="900" cy="205" rx="55" ry="6" fill="#ffe9b0" opacity="0.18">
    <animate attributeName="opacity" dur="2.2s" repeatCount="indefinite" values="0.1;0.25;0.1"/>
  </ellipse>

  <!-- Barquinho boiando sobre as ondas, com bobbing sincronizado ao período da onda frontal -->
  <g transform="translate(560,193)">
    <g>
      <animateTransform attributeName="transform" type="translate" dur="4s" repeatCount="indefinite"
        values="0,-6; 0,6; 0,-6"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="4s" repeatCount="indefinite"
          values="-3.5 0 8; 3.5 0 8; -3.5 0 8"/>
        <!-- casco -->
        <path d="M -26,8 L 26,8 L 17,20 L -17,20 Z" fill="#d9a066" stroke="#7a4a24" stroke-width="1.5"/>
        <!-- mastro -->
        <line x1="0" y1="8" x2="0" y2="-26" stroke="#7a4a24" stroke-width="2"/>
        <!-- vela -->
        <path d="M 1,-25 L 1,4 L 20,4 Z" fill="#f4f1e6" stroke="#c9c4b0" stroke-width="1"/>
        <!-- bandeirinha -->
        <path d="M 1,-26 L 9,-23 L 1,-20 Z" fill="#e2574c"/>
      </g>
    </g>
  </g>

  <!-- Lua cheia, limpa, com halo suave pulsando -->
  <g transform="translate(900,55)">
    <circle r="38" fill="#ffe9a8" opacity="0.15">
      <animate attributeName="opacity" dur="3s" repeatCount="indefinite" values="0.1;0.25;0.1"/>
      <animate attributeName="r" dur="3s" repeatCount="indefinite" values="36;42;36"/>
    </circle>
    <circle r="26" fill="#ffe9a8"/>
    <circle cx="-8" cy="-6" r="4" fill="#f0d68a" opacity="0.6"/>
    <circle cx="7" cy="9" r="3" fill="#f0d68a" opacity="0.5"/>
    <circle cx="10" cy="-10" r="2.2" fill="#f0d68a" opacity="0.5"/>
  </g>
</svg>
